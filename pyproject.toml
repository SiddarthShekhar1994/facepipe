[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "facepipe"
version = "0.1.0"
description = "Local face detection and recognition pipeline: webcam in, labeled faces out."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "onnxruntime==1.30.0",
]

[project.optional-dependencies]
quant = ["onnx==1.23.0"]  # only to produce an INT8 model with `facepipe quantize`; never needed to run one

[tool.setuptools]
packages = ["facepipe"]

[project.scripts]
facepipe = "facepipe.cli:main"
